name: Materialize Launcher Icons

on:
  push:
    branches:
      - "feature/launcher-icons-v0.2b"
    paths:
      - "tools/icon-source/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/launcher-icons-v0.2b
          fetch-depth: 0

      - name: Rebuild source PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/icon-work
          cat tools/icon-source/legacy/*.b64 | tr -d '\n\r' | base64 -d > build/icon-work/ic_launcher_source.png
          echo "Expected SHA256: 91e54291a4e04382e9fb8ebb114ffc3d3ff302a5c5d056d7fa1a8f3ffbe49c83"
          echo "Actual:"
          sha256sum build/icon-work/ic_launcher_source.png
          echo "91e54291a4e04382e9fb8ebb114ffc3d3ff302a5c5d056d7fa1a8f3ffbe49c83  build/icon-work/ic_launcher_source.png" | sha256sum -c -
          file build/icon-work/ic_launcher_source.png

      - name: Prepare image converter
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            echo "ICON_CONVERT=magick" >> "$GITHUB_ENV"
          elif command -v convert >/dev/null 2>&1; then
            echo "ICON_CONVERT=convert" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            echo "ICON_CONVERT=convert" >> "$GITHUB_ENV"
          fi

      - name: Generate Android density icons
        shell: bash
        run: |
          set -euo pipefail
          src="build/icon-work/ic_launcher_source.png"
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable-nodpi

          "$ICON_CONVERT" "$src" -filter Lanczos -resize 48x48  app/src/main/res/mipmap-mdpi/ic_launcher.png
          "$ICON_CONVERT" "$src" -filter Lanczos -resize 72x72  app/src/main/res/mipmap-hdpi/ic_launcher.png
          "$ICON_CONVERT" "$src" -filter Lanczos -resize 96x96  app/src/main/res/mipmap-xhdpi/ic_launcher.png
          "$ICON_CONVERT" "$src" -filter Lanczos -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp "$src" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp app/src/main/res/mipmap-mdpi/ic_launcher.png    app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png    app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xhdpi/ic_launcher.png   app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png  app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          cp "$src" app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          identify app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          identify app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          identify app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          identify app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          identify app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Commit real PNG resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res
          git commit -m "assets: materialize Android launcher icons" || exit 0
          git push origin HEAD:feature/launcher-icons-v0.2b
