name: Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners include Android command-line tools.
      # setup-android@v3 currently attempts to install removed SDK package "tools".
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager unavailable on runner"; exit 1; }
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile Dont-Tread-On-My-Smartphone
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dont-tread-on-my-smartphone-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
